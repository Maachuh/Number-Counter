<!DOCTYPE html>
<html>
    <head>
        <title>Number Counter</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div id="page-wrapper">
            <div id="title">
                <h1>Number Counter</h1>
                <h3>Created By Maachuh</h3>
            </div>
            <div id="game-container">
                <p id="counter">0</p>
                <div id="button-container">
                    <button onclick="btnDecreaseCounter()" class="button">Decrease -</button>
                    <button onclick="btnResetCounter()" class="button">Reset</button>
                    <button onclick="btnIncreaseCounter()" class="button">Increase +</button>
                </div>
            </div>
        </div>
    </body>


    <script src="index.js"></script>
</html>
